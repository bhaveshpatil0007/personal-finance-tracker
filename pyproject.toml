[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-tracker-demo"
version = "1.0.0"
description = "Local CSV expense categorization, visualization, and baseline forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.24,<3", "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4", "seaborn>=0.13,<0.14"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
finance-tracker = "finance_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
